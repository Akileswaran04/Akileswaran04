<svg xmlns="http://www.w3.org/2000/svg" width="860" height="222" viewBox="0 0 860 222" font-family="ui-monospace,monospace">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="g-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g-blur-lg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="g-blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <!-- Gradient background -->
  <rect width="860" height="222" rx="18" fill="url(#g-bg)"/>
  <!-- Colour blobs (simulating what blur-behind glass reveals) -->
  <circle cx="155" cy="78" r="120" fill="#22D3EE" opacity="0.12" filter="url(#g-blur-lg)"/>
  <circle cx="671" cy="144" r="86" fill="#38BDF8"  opacity="0.10" filter="url(#g-blur-lg)"/>
  <circle cx="430" cy="33" r="60" fill="#22D3EE" opacity="0.08" filter="url(#g-blur-sm)"/>
  <!-- Glass pane surface -->
  <rect x="0" y="0" width="860" height="222" rx="18" fill="#ffffff" fill-opacity="0.06"/>
  <!-- Glass border -->
  <rect x="0.5" y="0.5" width="859" height="221" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Top light-catching highlight -->
  <rect x="2" y="2" width="856" height="6" rx="18" fill="url(#g-top)"/>
<text x="430.0" y="52" fill="#22D3EE" font-size="26" font-weight="700" text-anchor="middle" font-family="ui-monospace,monospace">🚧 Building now</text>
  <text x="28" y="78" fill="#38BDF8" font-size="14" font-weight="700">PID</text>
