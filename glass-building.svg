  <text x="238" y="78" fill="#38BDF8" font-size="14" font-weight="700">Stack</text>
  <text x="678" y="78" fill="#38BDF8" font-size="14" font-weight="700">CPU</text>
  <text x="28" y="106" fill="#7d8590" font-size="14">001</text>
  <text x="86" y="106" fill="#e6edf3" font-size="14" font-weight="600">SENTRI</text>
  <text x="238" y="106" fill="#e6edf3" font-size="14">Streamlit · FastAPI · XGBoost</text>
  <text x="678" y="106" fill="#22D3EE" font-size="14" font-weight="600">42%</text>
  <text x="28" y="134" fill="#7d8590" font-size="14">002</text>
  <text x="86" y="134" fill="#e6edf3" font-size="14" font-weight="600">Riddle Rush</text>
  <text x="238" y="134" fill="#e6edf3" font-size="14">React · Three.js · Supabase</text>
