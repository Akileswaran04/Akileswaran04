<svg xmlns="http://www.w3.org/2000/svg" width="860" height="123.5" viewBox="0 0 860 123.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="g-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g-blur-lg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="g-blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <!-- Gradient background -->
  <rect width="860" height="123.5" rx="12" fill="url(#g-bg)"/>
  <!-- Colour blobs -->
  <circle cx="155" cy="43" r="120" fill="#22D3EE" opacity="0.12" filter="url(#g-blur-lg)"/>
  <circle cx="671" cy="80" r="86" fill="#38BDF8"  opacity="0.10" filter="url(#g-blur-lg)"/>
  <circle cx="430" cy="19" r="60" fill="#22D3EE" opacity="0.08" filter="url(#g-blur-sm)"/>
  <!-- Glass pane surface (8% white) -->
  <rect x="0" y="0" width="860" height="123.5" rx="12" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Glass border (18% white) -->
  <rect x="0.5" y="0.5" width="859" height="122.5" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Top light-catching highlight -->
  <rect x="2" y="2" width="856" height="6" rx="12" fill="url(#g-top)"/>
  <!-- Title bar chrome (solid, not glass) -->
